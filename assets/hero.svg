<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Code editor preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#131c30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#grid)"/>
  <circle cx="660" cy="90" r="220" fill="url(#glowA)"/>
  <circle cx="120" cy="450" r="230" fill="url(#glowB)"/>

  <!-- editor window -->
  <g>
    <rect x="90" y="96" width="620" height="330" rx="22" fill="#0e1524" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="90" y="96" width="620" height="46" rx="22" fill="#141d30"/>
    <rect x="90" y="120" width="620" height="22" fill="#141d30"/>
    <circle cx="126" cy="119" r="7" fill="#ff5f57"/>
    <circle cx="150" cy="119" r="7" fill="#febc2e"/>
    <circle cx="174" cy="119" r="7" fill="#28c840"/>

    <!-- gutter -->
    <rect x="118" y="166" width="14" height="14" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="118" y="198" width="14" height="14" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="118" y="230" width="14" height="14" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="118" y="262" width="14" height="14" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="118" y="294" width="14" height="14" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="118" y="326" width="14" height="14" rx="4" fill="#ffffff" fill-opacity="0.12"/>

    <!-- code lines -->
    <rect x="152" y="166" width="180" height="14" rx="7" fill="url(#accent)"/>
    <rect x="344" y="166" width="96" height="14" rx="7" fill="#ffffff" fill-opacity="0.14"/>

    <rect x="152" y="198" width="60" height="14" rx="7" fill="#06b6d4" fill-opacity="0.75"/>
    <rect x="224" y="198" width="210" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>

    <rect x="184" y="230" width="150" height="14" rx="7" fill="#6366f1" fill-opacity="0.8"/>
    <rect x="346" y="230" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>

    <rect x="184" y="262" width="238" height="14" rx="7" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="434" y="262" width="70" height="14" rx="7" fill="#f472b6" fill-opacity="0.6"/>

    <rect x="184" y="294" width="96" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="292" y="294" width="168" height="14" rx="7" fill="#06b6d4" fill-opacity="0.55"/>

    <rect x="152" y="326" width="42" height="14" rx="7" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="206" y="326" width="250" height="14" rx="7" fill="#ffffff" fill-opacity="0.1"/>

    <!-- caret -->
    <rect x="152" y="358" width="4" height="20" rx="2" fill="#06b6d4"/>
  </g>

  <!-- floating card -->
  <g transform="translate(430 340)">
    <rect width="280" height="112" rx="20" fill="#141d30" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="22" y="24" width="46" height="46" rx="14" fill="url(#accent)"/>
    <rect x="84" y="30" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="84" y="52" width="76" height="12" rx="6" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="22" y="84" width="236" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
  </g>
</svg>
