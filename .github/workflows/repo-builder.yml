name: Build & Deploy Cydia/Sileo Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install APT Repository Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 xz-utils gzip

      - name: Generate APT Indexes (Packages & Compressed)
        run: |
          mkdir -p debs
          rm -f Packages Packages.gz Packages.xz Packages.bz2 Release Release.gpg
          dpkg-scanpackages -m ./debs /dev/null > Packages
          cp Packages Packages.original
          gzip -c9 Packages.original > Packages.gz
          xz -c9 Packages.original > Packages.xz
          bzip2 -c9 Packages.original > Packages.bz2
          mv Packages.original Packages

      - name: Generate Release File
        run: |
          REPO_NAME="سورس أبو سعود | Abu Saud Repo"
          REPO_DESC="أدوات وتعديلات جيلبريك Dopamine & RootHide"
          
          cat << R_EOF > Release
Origin: ${REPO_NAME}
Label: ${REPO_NAME}
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm iphoneos-arm64
Components: main
Description: ${REPO_DESC}
MD5Sum:
 $(md5sum Packages | cut -d ' ' -f 1) $(wc -c < Packages) Packages
 $(md5sum Packages.gz | cut -d ' ' -f 1) $(wc -c < Packages.gz) Packages.gz
 $(md5sum Packages.xz | cut -d ' ' -f 1) $(wc -c < Packages.xz) Packages.xz
 $(md5sum Packages.bz2 | cut -d ' ' -f 1) $(wc -c < Packages.bz2) Packages.bz2
SHA256:
 $(sha256sum Packages | cut -d ' ' -f 1) $(wc -c < Packages) Packages
 $(sha256sum Packages.gz | cut -d ' ' -f 1) $(wc -c < Packages.gz) Packages.gz
 $(sha256sum Packages.xz | cut -d ' ' -f 1) $(wc -c < Packages.xz) Packages.xz
 $(sha256sum Packages.bz2 | cut -d ' ' -f 1) $(wc -c < Packages.bz2) Packages.bz2
R_EOF

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
