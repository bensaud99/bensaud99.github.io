name: Build & Deploy Cydia/Sileo Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install APT Repository Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 xz-utils gzip

      - name: Generate APT Indexes
        run: |
          mkdir -p debs
          rm -f Packages Packages.gz Packages.xz Packages.bz2 Release
          dpkg-scanpackages -m ./debs /dev/null > Packages
          cp Packages Packages.original
          gzip -c9 Packages.original > Packages.gz
          xz -c9 Packages.original > Packages.xz
          bzip2 -c9 Packages.original > Packages.bz2
          mv Packages.original Packages

      - name: Generate Release File
        run: |
          echo "Origin: سورس بن سعود | Ben Saud Repo" > Release
          echo "Label: سورس بن سعود | Ben Saud Repo" >> Release
          echo "Suite: stable" >> Release
          echo "Version: 1.0" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e" >> Release
          echo "Components: main" >> Release
          echo "Description: أدوات وتعديلات جيلبريك Dopamine & RootHide" >> Release
          echo "MD5Sum:" >> Release
          printf " $(md5sum Packages | cut -d ' ' -f 1) %s Packages\n" "$(wc -c < Packages)" >> Release
          printf " $(md5sum Packages.gz | cut -d ' ' -f 1) %s Packages.gz\n" "$(wc -c < Packages.gz)" >> Release
          printf " $(md5sum Packages.xz | cut -d ' ' -f 1) %s Packages.xz\n" "$(wc -c < Packages.xz)" >> Release
          printf " $(md5sum Packages.bz2 | cut -d ' ' -f 1) %s Packages.bz2\n" "$(wc -c < Packages.bz2)" >> Release
          echo "SHA256:" >> Release
          printf " $(sha256sum Packages | cut -d ' ' -f 1) %s Packages\n" "$(wc -c < Packages)" >> Release
          printf " $(sha256sum Packages.gz | cut -d ' ' -f 1) %s Packages.gz\n" "$(wc -c < Packages.gz)" >> Release
          printf " $(sha256sum Packages.xz | cut -d ' ' -f 1) %s Packages.xz\n" "$(wc -c < Packages.xz)" >> Release
          printf " $(sha256sum Packages.bz2 | cut -d ' ' -f 1) %s Packages.bz2\n" "$(wc -c < Packages.bz2)" >> Release

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
